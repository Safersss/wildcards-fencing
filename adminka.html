<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Cards Fencing — Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; font-family: 'Inter', sans-serif; color: #fff; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-family: 'Oswald', sans-serif; text-align: center; }
        h1 span { color: #d32f2f; }
        .login, .panel { background: #111; border: 1px solid #333; padding: 30px; border-radius: 15px; margin: 50px auto; max-width: 400px; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        button { background: #d32f2f; color: #fff; border: none; padding: 12px 24px; cursor: pointer; border-radius: 8px; margin-top: 10px; }
        .page-btn { background: #222; padding: 10px 20px; margin: 5px; display: inline-block; cursor: pointer; border-radius: 8px; }
        .page-btn.active { background: #d32f2f; }
        .editor { display: none; margin-top: 30px; }
        .field-group { margin-bottom: 20px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 8px; }
        .status.success { background: #1e4620; color: #8bc34a; }
        .status.error { background: #5c1e1e; color: #ff8a80; }
    </style>
</head>
<body>
<div class="container">
    <div id="login" class="login">
        <h2>⚔️ WILD CARDS FENCING</h2>
        <input type="password" id="pwd" placeholder="Пароль">
        <button onclick="login()">Войти</button>
    </div>
    <div id="panel" class="panel" style="display:none;">
        <h1>Админ-панель <span>WCF</span></h1>
        <div>
            <div class="page-btn active" onclick="selectPage('index')">Главная</div>
            <div class="page-btn" onclick="selectPage('about')">О школе</div>
            <div class="page-btn" onclick="selectPage('contacts')">Контакты</div>
            <div class="page-btn" onclick="selectPage('trainers')">Тренеры</div>
        </div>
        <div id="form-index" class="editor" style="display:block;">
            <h3>🏠 Главная</h3>
            <div class="field-group"><label>Слово CARDS:</label><input type="text" id="logo_accent" value="CARDS"></div>
            <div class="field-group"><label>Слово FENCING:</label><input type="text" id="logo_text" value="FENCING"></div>
            <div class="field-group"><label>Текст под заголовком:</label><textarea id="hero_text">Школа фехтования для детей и взрослых. От Средневековья до современности.</textarea></div>
            <div class="field-group"><label>Телефон:</label><input type="text" id="phone_main" value="+7 906 068 88 45"></div>
        </div>
        <div id="form-about" class="editor">
            <h3>📖 О школе</h3>
            <div class="field-group"><label>Текст:</label><textarea id="about_text1">Wild Cards Fencing — первая многопрофильная школа фехтования в Москве. Мы объединяем традиции и современность, Европу и Восток. Наши тренеры — чемпионы России и мира.</textarea></div>
        </div>
        <div id="form-contacts" class="editor">
            <h3>📞 Контакты</h3>
            <div class="field-group"><label>Адрес:</label><input type="text" id="sg_address" value="9-я ул. Соколиной горы, д.6, 4 этаж"></div>
            <div class="field-group"><label>Телефон:</label><input type="text" id="phone" value="+7 906 068 88 45"></div>
        </div>
        <div id="form-trainers" class="editor">
            <h3>👥 Тренеры</h3>
            <div class="field-group"><label>Тренер 1:</label><input type="text" id="trainer1_name" value="Алексей Бесфамильный"></div>
        </div>
        <div class="field-group"><label>🔑 GitHub токен:</label><input type="password" id="token" placeholder="ghp_..."></div>
        <button onclick="publish()">🚀 Опубликовать на GitHub</button>
        <div id="status" class="status"></div>
    </div>
</div>
<script>
    function login() {
        if (document.getElementById('pwd').value === 'WCF2025') {
            document.getElementById('login').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            loadData();
        } else alert('Неверный пароль');
    }
    function selectPage(page) {
        document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.editor').forEach(e => e.style.display = 'none');
        document.getElementById(`form-${page}`).style.display = 'block';
        loadData();
    }
    function loadData() {
        document.getElementById('logo_accent').value = localStorage.getItem('logo_accent') || 'CARDS';
        document.getElementById('logo_text').value = localStorage.getItem('logo_text') || 'FENCING';
        document.getElementById('hero_text').value = localStorage.getItem('hero_text') || 'Школа фехтования...';
        document.getElementById('sg_address').value = localStorage.getItem('sg_address') || '9-я ул. Соколиной горы, д.6, 4 этаж';
        document.getElementById('phone').value = localStorage.getItem('phone') || '+7 906 068 88 45';
        document.getElementById('about_text1').value = localStorage.getItem('about_text1') || 'Wild Cards Fencing — первая многопрофильная школа...';
        document.getElementById('trainer1_name').value = localStorage.getItem('trainer1_name') || 'Алексей Бесфамильный';
        document.getElementById('phone_main').value = localStorage.getItem('phone_main') || '+7 906 068 88 45';
        document.getElementById('token').value = localStorage.getItem('github_token') || '';
    }
    function saveLocal() {
        localStorage.setItem('logo_accent', document.getElementById('logo_accent').value);
        localStorage.setItem('logo_text', document.getElementById('logo_text').value);
        localStorage.setItem('hero_text', document.getElementById('hero_text').value);
        localStorage.setItem('sg_address', document.getElementById('sg_address').value);
        localStorage.setItem('phone', document.getElementById('phone').value);
        localStorage.setItem('about_text1', document.getElementById('about_text1').value);
        localStorage.setItem('trainer1_name', document.getElementById('trainer1_name').value);
        localStorage.setItem('phone_main', document.getElementById('phone_main').value);
    }
    async function publish() {
        const token = document.getElementById('token').value.trim();
        if (!token) { showStatus('❌ Введи токен', 'error'); return; }
        localStorage.setItem('github_token', token);
        saveLocal();
        showStatus('⏳ Публикация...', 'info');
        const phone = document.getElementById('phone_main').value;
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Wild Cards Fencing</title><style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:50px;}h1{color:#d32f2f;}</style></head><body><h1>Wild Cards Fencing</h1><p>${document.getElementById('hero_text').value}</p><p>Телефон: ${phone}</p></body></html>`;
        const url = `https://api.github.com/repos/safersss/wildcards-fencing/contents/index.html`;
        try {
            let sha = null;
            const get = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (get.ok) sha = (await get.json()).sha;
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Update from admin', content: btoa(unescape(encodeURIComponent(html))), sha })
            });
            if (res.ok) showStatus('✅ Готово! Обнови сайт через 1-2 минуты', 'success');
            else showStatus('❌ Ошибка', 'error');
        } catch(e) { showStatus('❌ Ошибка', 'error'); }
    }
    function showStatus(msg, type) {
        const st = document.getElementById('status');
        st.textContent = msg;
        st.className = `status ${type}`;
        setTimeout(() => st.style.display = 'none', 4000);
    }
</script>
</body>
</html>
