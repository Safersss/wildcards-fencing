<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сохранение на GitHub</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
        pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; }
        button { background: #d32f2f; color: #fff; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin: 10px 0; background: #222; color: #fff; border: 1px solid #444; }
        .success { color: #8bc34a; }
        .error { color: #ff8a80; }
    </style>
</head>
<body>
    <h1>💾 Сохранение изменений на GitHub</h1>
    <p>Вставь сюда содержимое файла, который хочешь сохранить, укажи путь и нажми «Сохранить».</p>
    
    <label>🔑 Токен GitHub (ghp_...):</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx">
    
    <label>📁 Путь к файлу (например, index.html):</label>
    <input type="text" id="filepath" placeholder="index.html">
    
    <label>📄 Содержимое файла:</label>
    <textarea id="content" rows="15" placeholder="Вставь сюда HTML-код..."></textarea>
    
    <button id="saveBtn">Сохранить на GitHub</button>
    <div id="status"></div>
    
    <script>
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const token = document.getElementById('token').value.trim();
            const filepath = document.getElementById('filepath').value.trim();
            const content = document.getElementById('content').value;
            const statusDiv = document.getElementById('status');
            
            if (!token || !filepath || !content) {
                statusDiv.innerHTML = '<span class="error">❌ Заполни все поля</span>';
                return;
            }
            
            statusDiv.innerHTML = '⏳ Сохраняю...';
            
            try {
                // Получаем текущую версию файла (нужно для sha)
                const repo = 'safersss/wildcards-fencing';
                const url = `https://api.github.com/repos/${repo}/contents/${filepath}`;
                
                let sha = null;
                try {
                    const getRes = await fetch(url, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getRes.ok) {
                        const data = await getRes.json();
                        sha = data.sha;
                    }
                } catch(e) { /* файл новый — sha не нужен */ }
                
                // Отправляем обновление
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Обновление ${filepath}`,
                        content: btoa(unescape(encodeURIComponent(content))),
                        sha: sha
                    })
                });
                
                const result = await response.json();
                if (response.ok) {
                    statusDiv.innerHTML = '<span class="success">✅ Файл сохранён на GitHub! Обнови сайт через 1-2 минуты.</span>';
                } else {
                    statusDiv.innerHTML = `<span class="error">❌ Ошибка: ${result.message}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Ошибка: ${error.message}</span>`;
            }
        });
    </script>
</body>
</html>
