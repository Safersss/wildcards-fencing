backend:
  name: github
  repo: safersss/wildcards-fencing
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "pages"
    label: "Страницы"
    files:
      - name: "index"
        label: "Главная"
        file: "index.html"
        fields:
          - { name: "body", label: "Содержание", widget: "markdown" }
