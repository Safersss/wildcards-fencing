          - { name: "body", label: "Содержание", widget: "markdown" }
      - name: "schedule"
        label: "Расписание"
        file: "schedule.html"
        fields:
          - { name: "body", label: "Содержание", widget: "markdown" }
      - name: "prices"
        label: "Цены"
        file: "prices.html"
        fields:
          - { name: "body", label: "Содержание", widget: "markdown" }
      - name: "contacts"
