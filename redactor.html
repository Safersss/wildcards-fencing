<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактор главной страницы</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 60vh; background: #111; color: #fff; border: 1px solid #333; padding: 10px; }
        button { background: #d32f2f; color: #fff; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        .success { background: #1e4620; color: #8bc34a; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>📝 Редактор главной страницы</h2>
    <p>1. Отредактируй код в окне (меняй ТОЛЬКО текст, не трогай теги &lt; и &gt;)</p>
    <p>2. Нажми «Скопировать»</p>
    <p>3. Зайди на GitHub → открой index.html → «Edit» → вставь → Commit</p>
    <textarea id="code"></textarea>
    <br>
    <button onclick="copyCode()">📋 Скопировать код</button>
    <div id="status"></div>

    <script>
        // Загружаем текущий index.html
        fetch('index.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('code').value = html;
            });

        function copyCode() {
            const code = document.getElementById('code').value;
            navigator.clipboard.writeText(code);
            const status = document.getElementById('status');
            status.innerHTML = '<div class="success">✅ Код скопирован! Теперь зайди на GitHub и замени index.html</div>';
            setTimeout(() => status.innerHTML = '', 5000);
        }
    </script>
</body>
</html>
