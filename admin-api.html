<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель WCF — автоматическое сохранение</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: 'Inter', 'Segoe UI', sans-serif; color: #fff; line-height: 1.5; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #111; border: 1px solid #222; border-radius: 15px; padding: 30px; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 40px; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        h1 span { color: #d32f2f; }
        .sub { text-align: center; color: #aaa; margin-bottom: 30px; }
        .field-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; }
        input, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; }
        textarea { min-height: 120px; }
        button { background: #d32f2f; color: #fff; border: none; padding: 12px 24px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; border-radius: 8px; margin-top: 10px; }
        .token-section { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .status { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
        .status.success { background: #1e4620; color: #8bc34a; display: block; }
        .status.error { background: #5c1e1e; color: #ff8a80; display: block; }
        .status.info { background: #1e3a5f; color: #8bb9ff; display: block; }
        .preview { background: #0a0a0a; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #222; }
        .preview h3 { color: #d32f2f; margin-bottom: 15px; }
        hr { border-color: #222; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Админ-панель <span>WCF</span></h1>
    <div class="sub">Автоматическое сохранение на GitHub (одна кнопка)</div>

    <div class="token-section">
        <label>🔑 GitHub токен (нужен доступ repo)</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
        <button id="saveTokenBtn">💾 Сохранить токен</button>
    </div>

    <div id="editorArea" style="display:none;">
        <div class="field-group">
            <label>🏷️ Логотип — слово CARDS</label>
            <input type="text" id="logo_accent" placeholder="CARDS">
        </div>
        <div class="field-group">
            <label>🏷️ Логотип — слово FENCING</label>
            <input type="text" id="logo_text" placeholder="FENCING">
        </div>
        <div class="field-group">
            <label>📢 Заголовок — слово CARDS</label>
            <input type="text" id="hero_accent" placeholder="CARDS">
        </div>
        <div class="field-group">
            <label>📢 Заголовок — слово FENCING</label>
            <input type="text" id="hero_title" placeholder="FENCING">
        </div>
        <div class="field-group">
            <label>📝 Текст под заголовком</label>
            <textarea id="hero_text">Школа фехтования для детей и взрослых. От Средневековья до современности.</textarea>
        </div>
        <div class="field-group">
            <label>📞 Телефон</label>
            <input type="text" id="phone" placeholder="+7 906 068 88 45">
        </div>
        <div class="field-group">
            <label>✉️ Email</label>
            <input type="text" id="email" placeholder="info@wildcardsfencing.ru">
        </div>
        <div class="field-group">
            <label>🏠 Адрес (Соколиная Гора)</label>
            <input type="text" id="address" placeholder="9-я ул. Соколиной горы, д.6, 4 этаж">
        </div>

        <button id="publishBtn">🚀 Сохранить на GitHub</button>
        <div id="status" class="status"></div>

        <div class="preview">
            <h3>👁️ Предпросмотр изменений</h3>
            <div id="preview"></div>
        </div>
    </div>
</div>

<script>
    let githubToken = localStorage.getItem('github_token') || '';
    const tokenInput = document.getElementById('githubToken');
    const editorArea = document.getElementById('editorArea');
    
    if (githubToken) {
        tokenInput.value = githubToken;
        editorArea.style.display = 'block';
        loadCurrentData();
    }
    
    document.getElementById('saveTokenBtn').addEventListener('click', () => {
        const token = tokenInput.value.trim();
        if (token && token.startsWith('ghp_')) {
            githubToken = token;
            localStorage.setItem('github_token', token);
            editorArea.style.display = 'block';
            loadCurrentData();
            showStatus('✅ Токен сохранён!', 'success');
        } else {
            showStatus('❌ Неверный токен (должен начинаться с ghp_)', 'error');
        }
    });
    
    async function loadCurrentData() {
        showStatus('⏳ Загрузка данных с GitHub...', 'info');
        try {
            const url = 'https://api.github.com/repos/safersss/wildcards-fencing/contents/index.html';
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${githubToken}` }
            });
            if (response.ok) {
                const data = await response.json();
                const content = atob(data.content);
                extractTextFromHTML(content);
                showStatus('✅ Данные загружены', 'success');
            } else {
                showStatus('❌ Ошибка загрузки файла', 'error');
            }
        } catch (error) {
            showStatus('❌ Ошибка соединения', 'error');
        }
    }
    
    function extractTextFromHTML(html) {
        // Простое извлечение текста из нужных мест
        const logoMatch = html.match(/WILD <span>([^<]+)<\/span><br>([^<]+)/);
        if (logoMatch) {
            document.getElementById('logo_accent').value = logoMatch[1];
            document.getElementById('logo_text').value = logoMatch[2];
        }
        const heroMatch = html.match(/WILD <span>([^<]+)<\/span><br>([^<]+)/);
        if (heroMatch && heroMatch !== logoMatch) {
            document.getElementById('hero_accent').value = heroMatch[1];
            document.getElementById('hero_title').value = heroMatch[2];
        } else {
            document.getElementById('hero_accent').value = 'CARDS';
            document.getElementById('hero_title').value = 'FENCING';
        }
        const textMatch = html.match(/<p>([^<]+)<\/p>/);
        if (textMatch) document.getElementById('hero_text').value = textMatch[1];
        const phoneMatch = html.match(/\+7\s?9[0-9]{2}\s?[0-9]{3}\s?[0-9]{2}\s?[0-9]{2}/);
        if (phoneMatch) document.getElementById('phone').value = phoneMatch[0];
        const emailMatch = html.match(/info@wildcardsfencing\.ru/);
        if (emailMatch) document.getElementById('email').value = emailMatch[0];
        
        updatePreview();
    }
    
    function updatePreview() {
        const previewDiv = document.getElementById('preview');
        previewDiv.innerHTML = `
            <div style="background:#000; padding:20px; text-align:center;">
                <div style="font-family:'Oswald'; font-size:28px;">WILD <span style="color:#d32f2f;">${document.getElementById('logo_accent').value}</span><br>${document.getElementById('logo_text').value}</div>
                <div style="font-family:'Oswald'; font-size:48px; margin-top:20px;">WILD <span style="color:#d32f2f;">${document.getElementById('hero_accent').value}</span><br>${document.getElementById('hero_title').value}</div>
                <div style="color:#aaa; margin:20px 0;">${document.getElementById('hero_text').value}</div>
                <div style="background:#d32f2f; display:inline-block; padding:10px 20px; border-radius:30px;">Записаться на пробное занятие</div>
                <hr style="margin:20px 0;">
                <div>📞 ${document.getElementById('phone').value}</div>
                <div>✉️ ${document.getElementById('email').value}</div>
                <div>📍 ${document.getElementById('address').value}</div>
            </div>
        `;
    }
    
    document.getElementById('publishBtn').addEventListener('click', async () => {
        const token = githubToken;
        if (!token) {
            showStatus('❌ Введи и сохрани токен', 'error');
            return;
        }
        
        showStatus('⏳ Сохранение на GitHub...', 'info');
        
        // Загружаем текущий index.html
        const url = 'https://api.github.com/repos/safersss/wildcards-fencing/contents/index.html';
        let sha = null;
        let currentContent = '';
        
        try {
            const getRes = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
                currentContent = atob(data.content);
            } else {
                showStatus('❌ Не удалось загрузить файл', 'error');
                return;
            }
        } catch (e) {
            showStatus('❌ Ошибка загрузки', 'error');
            return;
        }
        
        // Заменяем текст в HTML
        let newContent = currentContent;
        newContent = newContent.replace(/WILD <span>[^<]+<\/span><br>[^<]+/, `WILD <span>${document.getElementById('logo_accent').value}</span><br>${document.getElementById('logo_text').value}`);
        newContent = newContent.replace(/WILD <span>[^<]+<\/span><br>[^<]+/, `WILD <span>${document.getElementById('hero_accent').value}</span><br>${document.getElementById('hero_title').value}`);
        newContent = newContent.replace(/<p>[^<]*<\/p>/, `<p>${document.getElementById('hero_text').value}</p>`);
        newContent = newContent.replace(/\+7\s?9[0-9]{2}\s?[0-9]{3}\s?[0-9]{2}\s?[0-9]{2}/, document.getElementById('phone').value);
        newContent = newContent.replace(/info@wildcardsfencing\.ru/, document.getElementById('email').value);
        
        // Отправляем обновлённый файл
        try {
            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Обновление контента из админ-панели',
                    content: btoa(unescape(encodeURIComponent(newContent))),
                    sha: sha
                })
            });
            
            if (putRes.ok) {
                showStatus('✅ Готово! Сайт обновится через 1-2 минуты.', 'success');
            } else {
                const err = await putRes.json();
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
            }
        } catch (e) {
            showStatus('❌ Ошибка отправки', 'error');
        }
    });
    
    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = msg;
        statusDiv.className = `status ${type}`;
        setTimeout(() => statusDiv.style.display = 'none', 4000);
    }
    
    // Обновление предпросмотра при изменении полей
    const fields = ['logo_accent', 'logo_text', 'hero_accent', 'hero_title', 'hero_text', 'phone', 'email', 'address'];
    fields.forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
    });
</script>
</body>
</html>
