<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Cards Fencing — Редактор тренеров</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #fff;
            line-height: 1.5;
        }
        .admin-bar {
            position: sticky;
            top: 0;
            background: #0a0a0a;
            border-bottom: 2px solid #d32f2f;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            z-index: 1000;
        }
        .admin-bar button {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .admin-bar button:hover {
            background: #b71c1c;
        }
        .admin-bar .status {
            color: #8bc34a;
            font-size: 14px;
        }
        [contenteditable="true"] {
            outline: none;
            transition: 0.1s;
            padding: 4px;
            border-radius: 8px;
            display: inline-block;
            min-width: 50px;
        }
        [contenteditable="true"]:hover {
            background: rgba(211, 47, 47, 0.15);
            box-shadow: 0 0 0 1px #d32f2f;
        }
        [contenteditable="true"]:focus {
            background: rgba(211, 47, 47, 0.25);
            box-shadow: 0 0 0 2px #d32f2f;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            padding: 20px 0;
            border-bottom: 1px solid #222;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .logo img {
            height: 50px;
            width: auto;
            display: block;
        }
        .logo-text {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .logo-text span {
            color: #d32f2f;
        }
        nav a {
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            transition: 0.2s;
            text-transform: uppercase;
        }
        nav a:first-child {
            margin-left: 0;
        }
        nav a:hover {
            color: #d32f2f;
        }
        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin: 60px 0 40px;
            text-transform: uppercase;
        }
        h1 span {
            color: #d32f2f;
        }
        .trainers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 60px;
            justify-items: center;
        }
        .trainer-card {
            background: #111;
            padding: 20px;
            text-align: center;
            border: 1px solid #222;
            transition: 0.2s;
            width: 100%;
            max-width: 220px;
        }
        .trainer-card:hover {
            border-color: #d32f2f;
        }
        .trainer-card img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            margin-bottom: 15px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .trainer-card img:hover {
            border-color: #d32f2f;
            opacity: 0.8;
        }
        .trainer-card h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            display: block;
            text-align: center;
        }
        .trainer-card p {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 8px;
            display: block;
            text-align: center;
        }
        .trainer-card .role {
            color: #d32f2f;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            text-align: center;
        }
